			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "\n#!/bin/bash\nset -euo pipefail\nset -x\n\n# Ensure flutterfire is on PATH\nPATH=\"${PATH}:$FLUTTER_ROOT/bin:${PUB_CACHE:-$HOME/.pub-cache}/bin\"\n\n# ----- Resolve environment from CONFIGURATION (Debug-prod -> prod, Release-dev -> dev)\nenvironment=\"default\"\nif [[ \"${CONFIGURATION}\" =~ -([^-]+)$ ]]; then\n  environment=\"${BASH_REMATCH[1]}\"\nfi\necho \"Detected environment: ${environment}\"\n\n# ----- Decide Crashlytics upload script path (Pods or SPM)\nif [[ -z \"${PODS_ROOT:-}\" || ! -d \"$PODS_ROOT/FirebaseCrashlytics\" ]]; then\n  DERIVED_DATA_PATH=$(echo \"${BUILD_ROOT}\" | sed -E 's|(.*DerivedData/[^/]+).*|\\1|')\n  PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT=\"${DERIVED_DATA_PATH}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\"\nelse\n  PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT=\"$PODS_ROOT/FirebaseCrashlytics/run\"\nfi\n\n# ----- Build the correct GoogleService-Info.plist path per flavor\nGOOGLESERVICE_INFO_PLIST=\"${PROJECT_DIR}/Runner/config/${environment}/GoogleService-Info.plist\"\nexport FIREBASE_CONFIGURATION_FILE=\"${GOOGLESERVICE_INFO_PLIST}\"  # respected by flutterfire & Crashlytics\n\n# Skip if plist not found (don't break debug builds)\nif [[ ! -f \"${GOOGLESERVICE_INFO_PLIST}\" ]]; then\n  echo \"⚠️  GoogleService-Info.plist not found at ${GOOGLESERVICE_INFO_PLIST}. Skipping symbols upload.\"\n  exit 0\nfi\n\n# ----- Guardrails: skip on simulator and non-release\nif [[ \"${EFFECTIVE_PLATFORM_NAME:-}\" == \"-iphonesimulator\" ]]; then\n  echo \"Skipping Crashlytics symbols upload on simulator.\"\n  exit 0\nfi\n\n# Adjust this list to your real Release configs\nif [[ \"${CONFIGURATION}\" != \"Release\" && \"${CONFIGURATION}\" != \"Release-prod\" && \"${CONFIGURATION}\" != \"Release-staging\" ]]; then\n  echo \"Skipping Crashlytics symbols upload on non-release build (${CONFIGURATION}).\"\n  exit 0\nfi\n\n# ----- Run FlutterFire helper (uploads dSYMs using Crashlytics script)\nflutterfire upload-crashlytics-symbols \\\n  --upload-symbols-script-path=\"${PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT}\" \\\n  --platform=ios \\\n  --apple-project-path=\"${SRCROOT}\" \\\n  --env-platform-name=\"${PLATFORM_NAME}\" \\\n  --env-configuration=\"${CONFIGURATION}\" \\\n  --env-project-dir=\"${PROJECT_DIR}\" \\\n  --env-built-products-dir=\"${BUILT_PRODUCTS_DIR}\" \\\n  --env-dwarf-dsym-folder-path=\"${DWARF_DSYM_FOLDER_PATH}\" \\\n  --env-dwarf-dsym-file-name=\"${DWARF_DSYM_FILE_NAME}\" \\\n  --env-infoplist-path=\"${INFOPLIST_PATH}\" \\\n  --default-config=default\n\n# Optional: stamp file to satisfy Xcode's dependency analysis\nSTAMP=\"${BUILT_PRODUCTS_DIR}/upload_crashlytics_symbols_${environment}.stamp\"\ntouch \"${STAMP}\"\necho \"Created stamp: ${STAMP}\"\n";
