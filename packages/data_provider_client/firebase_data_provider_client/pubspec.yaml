name: firebase_data_provider_client
description: A Dart Client for the HTTP API
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  mime: ^2.0.0
  path: ^1.9.1
  uuid: ^4.5.1
  cloud_firestore: ^6.0.0
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.1
  flutter_stripe: ^12.1.1
  connectivity_plus: ^7.0.0
  cloud_functions: ^6.0.2
  data_provider_client:
    path: ../data_provider_client
  equatable: ^2.0.7
  file: ^7.0.1
  firebase_auth: ^6.0.0
  firebase_storage: ^13.0.1
  japx: ^2.2.0
  json_annotation: ^4.9.0
  models:
    path: ../../models
  rxdart: ^0.28.0
  storage_client:
    path: ../../storage_client/storage_client

dev_dependencies:
  build_runner: ^2.6.0
  mocktail: ^1.0.4
  test: ^1.25.2
  very_good_analysis: ^9.0.0