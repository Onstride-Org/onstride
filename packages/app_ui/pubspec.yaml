name: app_ui
description: App UI Component Library
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.5.0
  dropdown_button2: ^2.3.9
  duration: ^4.0.3
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  gap: ^3.0.1
  intl: ^0.20.2
  scrollable_positioned_list: ^0.3.8
  shimmer: ^3.0.0

dev_dependencies:
  build_runner: ^2.6.0
  flutter_gen_runner: ^5.11.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/credit_cards/
  fonts:
    # ------------------------------------------------------------------------------------
    # FONT
    # ------------------------------------------------------------------------------------
    - family: Inter
      fonts:
        - asset: assets/fonts/static/Inter_28pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/static/Inter_28pt-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/static/Inter_28pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/static/Inter_28pt-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/static/Inter_28pt-Light.ttf
          weight: 300
        - asset: assets/fonts/static/Inter_28pt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/static/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/Inter_28pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/static/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/Inter_28pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/static/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Inter_28pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/static/Inter_28pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Inter_28pt-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/static/Inter_28pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/static/Inter_28pt-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/static/Inter_28pt-Black.ttf
          weight: 900
        - asset: assets/fonts/static/Inter_28pt-BlackItalic.ttf
          weight: 900
          style: italic
    # ------------------------------------------------------------------------------------
    # ICONS
    # ------------------------------------------------------------------------------------
    - family: GLIcons
      fonts:
        - asset: assets/icons/fonts/GLIcons.ttf
flutter_gen:
  assets:
    outputs:
      package_parameter_enabled: true
  output: lib/src/generated/
  integrations:
    flutter_svg: true
